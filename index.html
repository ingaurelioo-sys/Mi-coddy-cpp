<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coddy - Aprende C++</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Coddy</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <span class="progress-percentage" id="progressText">0%</span>
    </header>

    <main class="lesson-card">
      <div class="badge" id="lessonBadge">Lección 1 de 3</div>
      <h2 id="lessonTitle">Cargando...</h2>
      <p id="lessonTheory" class="theory-text"></p>

      <div class="editor-section">
        <label for="codeEditor" class="editor-label">Tu código C++:</label>
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>

      <div class="action-bar">
        <button id="runBtn" class="btn primary-btn">Comprobar</button>
      </div>

      <div id="feedbackBox" class="feedback-box hidden"></div>
    </main>

    <footer class="app-footer">
      <button id="prevBtn" class="btn secondary-btn" disabled>Anterior</button>
      <button id="nextBtn" class="btn secondary-btn" disabled>Siguiente</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
